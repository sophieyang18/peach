services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: peach
      POSTGRES_USER: peach
      POSTGRES_PASSWORD: peach
    volumes:
      - peach-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U peach -d peach"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://peach:peach@postgres:5432/peach
      SYNC_DATABASE_URL: postgresql://peach:peach@postgres:5432/peach
      REDIS_URL: redis://redis:6379/0
      DEEPSEEK_API_KEY: ${DEEPSEEK_API_KEY:-}
      DEEPSEEK_BASE_URL: ${DEEPSEEK_BASE_URL:-https://api.deepseek.com}
      DEEPSEEK_MODEL: ${DEEPSEEK_MODEL:-deepseek-v4-flash}
      CORS_ORIGINS: '["http://localhost:5173","http://127.0.0.1:5173","http://localhost:8080","http://127.0.0.1:8080"]'
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).read()"]
      interval: 10s
      timeout: 5s
      retries: 12

  asr:
    build:
      context: .
      dockerfile: asr/Dockerfile
    cpus: "4.0"
    mem_limit: 8g
    environment:
      ASR_PORT: 8080
      FUNASR_PORT: 10095
      FUNASR_DECODER_THREADS: 3
      FUNASR_IO_THREADS: 1
      FUNASR_MODEL_THREADS: 1
      OMP_NUM_THREADS: 1
      MKL_NUM_THREADS: 1
      NUMEXPR_NUM_THREADS: 1
    ports:
      - "10096:8080"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8080/health', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 20

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_BASE_URL: /api
        VITE_ASR_WS_URL: ${VITE_ASR_WS_URL:-}
    depends_on:
      backend:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  peach-postgres:
