<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>桃子内部 Demo ATS 网申页</title>
    <style>
      :root {
        color: #2b2227;
        font-family: Inter, "PingFang SC", "Microsoft YaHei", sans-serif;
      }

      body {
        margin: 0;
        background: linear-gradient(135deg, #fff8fb 0%, #fff7df 100%);
      }

      main {
        width: min(980px, calc(100vw - 40px));
        margin: 40px auto;
      }

      header {
        margin-bottom: 22px;
      }

      header p {
        margin: 0 0 8px;
        color: #c83f75;
        font-weight: 900;
      }

      h1 {
        margin: 0;
        font-size: 34px;
        letter-spacing: 0;
      }

      .notice,
      form {
        border: 1px solid #efcfd0;
        border-radius: 18px;
        background: rgba(255, 255, 255, 0.8);
        box-shadow: 0 18px 44px rgba(213, 75, 128, 0.08);
      }

      .notice {
        margin-bottom: 18px;
        padding: 14px 16px;
        color: #80616d;
        line-height: 1.6;
      }

      form {
        display: grid;
        gap: 22px;
        padding: 24px;
      }

      section {
        display: grid;
        grid-template-columns: repeat(2, minmax(0, 1fr));
        gap: 14px;
      }

      h2 {
        grid-column: 1 / -1;
        margin: 0;
        font-size: 20px;
      }

      label {
        display: grid;
        gap: 7px;
        color: #755865;
        font-size: 13px;
        font-weight: 850;
      }

      input,
      select,
      textarea {
        min-height: 44px;
        border: 1px solid #ead5d0;
        border-radius: 12px;
        background: #fff;
        color: #2b2227;
        font: inherit;
        padding: 0 12px;
        outline: none;
      }

      textarea {
        min-height: 112px;
        padding: 12px;
        resize: vertical;
      }

      .full {
        grid-column: 1 / -1;
      }

      .actions {
        display: flex;
        justify-content: flex-end;
        gap: 10px;
      }

      button {
        min-height: 42px;
        border: 1px solid #e8cbc7;
        border-radius: 999px;
        background: #fff;
        color: #8f5264;
        padding: 0 18px;
        font-weight: 900;
      }

      button.primary {
        border: 0;
        background: linear-gradient(135deg, #e14d83, #f1845e);
        color: #fff;
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p>内部 Demo / Test Page</p>
        <h1>AI 产品经理校招网申</h1>
      </header>
      <div class="notice">
        这是桃子 Application Copilot 的稳定演示页面，字段结构尽量贴近真实 ATS。插件会扫描本页字段并辅助填写，但不会自动提交。
      </div>

      <form>
        <section>
          <h2>基本信息</h2>
          <label>姓名<input id="candidate-name" name="candidate_name" autocomplete="name" required /></label>
          <label>手机<input id="candidate-phone" name="mobile_phone" type="tel" required /></label>
          <label>邮箱<input id="candidate-email" name="email" type="email" required /></label>
          <label>目标岗位<input id="target-role" name="target_position" placeholder="如 AI 产品经理" /></label>
        </section>

        <section>
          <h2>教育经历</h2>
          <label>毕业院校<input id="school" name="school" /></label>
          <label>专业<input id="major" name="major" /></label>
          <label>学历<select id="degree" name="degree"><option></option><option>本科</option><option>硕士</option><option>博士</option></select></label>
          <label>毕业时间<input id="graduation-date" name="graduate_date" type="month" /></label>
        </section>

        <section>
          <h2>经历材料</h2>
          <label class="full">实习描述<textarea id="internship-desc" name="internship_description" placeholder="描述你最近一段实习的职责和结果"></textarea></label>
          <label>项目名称<input id="project-name" name="project_name" /></label>
          <label>技能<input id="skills" name="skills" placeholder="如 Figma、SQL、Python" /></label>
          <label class="full">项目描述<textarea id="project-desc" name="project_description"></textarea></label>
          <label class="full">奖项 / 竞赛经历<textarea id="awards" name="awards"></textarea></label>
        </section>

        <section>
          <h2>开放题</h2>
          <label class="full">为什么申请这个岗位？<textarea id="open-question-1" name="why_apply"></textarea></label>
          <label class="full">请介绍一个你最有代表性的产品项目，并说明你的贡献。<textarea id="open-question-2" name="project_story"></textarea></label>
          <input type="password" name="password_should_skip" placeholder="安全测试：插件应跳过密码字段" />
          <input type="hidden" name="hidden_should_skip" value="secret" />
        </section>

        <div class="actions">
          <button type="button">保存草稿</button>
          <button class="primary" type="button">模拟手动提交</button>
        </div>
      </form>
    </main>
  </body>
</html>
